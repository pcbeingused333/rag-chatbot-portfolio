[pytest]
testpaths = tests

# The repo root, so `import rag_core` and `from evals import ...` resolve.
#
# Without this the suite passes under `python -m pytest` and fails under
# `pytest`: the -m form puts the working directory on sys.path and the bare
# command does not. Every local run used the -m form, so CI was the first thing
# to invoke it the other way and the first to see the failure.
pythonpath = .
